<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16897d"><title>إضافة شواهد</title><link rel="stylesheet" href="style.css?v=20260921-4"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><main class="shell"><section class="form-panel no-print"><h1>إضافة شواهد</h1><p class="intro">عبّئ البيانات وارفع من صورة واحدة إلى 4 صور، ثم أنشئ التقرير على القالب المعتمد.</p><div class="template-switch-wrap"><span class="template-switch-label">نموذج الشاهد</span><div class="template-switch" role="group" aria-label="اختيار نموذج الشاهد"><button id="schoolTemplateBtn" class="template-switch-btn active" type="button" data-template="school" aria-pressed="true">نموذج المدرسة</button><button id="adminTemplateBtn" class="template-switch-btn" type="button" data-template="admin" aria-pressed="false">نموذج الإدارة</button><span id="templateSwitchSlider" class="template-switch-slider" aria-hidden="true"></span></div></div><form id="evidenceForm"><div class="form-grid"><label><span>اسم البرنامج</span><input id="program" required></label><label><span>نوع البرنامج</span><input id="programType" required></label><label><span>الجهة المنفذة</span><textarea id="entity" rows="3" required></textarea></label><label><span>المستهدفون</span><textarea id="target" rows="3" required></textarea></label><div class="hijri-field"><span>تاريخ التنفيذ (هجري)</span><div class="hijri-selects"><label><small>اليوم</small><select id="hDay" required></select></label><label><small>الشهر</small><select id="hMonth" required></select></label><label><small>السنة</small><select id="hYear" required></select></label></div></div><label><span>منفذ البرنامج</span><input id="teacher" required></label><label class="full"><span>الهدف من البرنامج</span><textarea id="goals" rows="4" placeholder="اكتب كل هدف في سطر مستقل" required></textarea></label><label class="full"><span>الأثر الذي تركه البرنامج (النتائج المتوقعة)</span><textarea id="impact" rows="4" placeholder="اكتب كل نتيجة في سطر مستقل" required></textarea></label><div class="full"><div class="upload-title"><span>صور الشواهد</span><small>4 صور كحد أقصى</small></div><label class="upload-box" for="photos"><strong>＋ اختر الصور</strong><span>يمكنك رفع 1 أو 2 أو 3 أو 4 صور</span></label><input id="photos" type="file" accept="image/*" multiple hidden><p id="uploadMsg" class="upload-msg"></p><div id="photosBanner" class="photos-banner empty"><div class="photos-banner-head"><strong>معاينة الصور المختارة</strong><span id="photosCount">لم يتم اختيار صور</span></div><div id="thumbs" class="thumbs"></div><div class="empty-photos">ستظهر الصور هنا فور اختيارها</div></div></div></div><div class="form-actions"><button id="createBtn" class="primary" type="submit">إنشاء الشاهد</button><button class="secondary" type="reset">مسح</button></div></form></section><section id="previewWrap" class="preview-wrap hidden"><div id="prepareStatus" class="share-panel no-print"><strong>جاري تجهيز ملف PDF والرابط...</strong></div><div id="readyActions" class="preview-actions no-print hidden"><button id="editBtn" class="secondary">العودة للتعديل</button><button id="imageBtn" class="secondary">تحميل صورة</button><button id="downloadPdfBtn" class="secondary">تحميل PDF</button><button id="printBtn" class="secondary">طباعة</button><button id="shareBtn" class="primary">مشاركة PDF</button><button id="copyLinkBtn" class="secondary">نسخ الرابط</button></div><div id="sharePanel" class="share-panel no-print hidden"><strong>تم تجهيز الشاهد</strong><input id="pdfLink" readonly dir="ltr"></div><div id="reportStage" class="report-stage"><article id="report" class="report template-report"><img id="templateBackground" class="template-background" src="template-school.png" alt=""><div id="rEntity" class="overlay entity"></div><div id="rTarget" class="overlay target"></div><div id="rProgram" class="overlay program"></div><div id="rType" class="overlay type"></div><div id="rDate" class="overlay date"></div><div id="rGoals" class="overlay goals"></div><div id="rImpact" class="overlay impact"></div><div id="rTeacher" class="overlay teacher"></div><div id="rPhotos" class="overlay photos-grid"></div></article></div></section></main><script src="script.js?v=20260921-4"></script></body></html>
